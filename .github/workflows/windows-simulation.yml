name: Windows simulation tests

on:
  workflow_dispatch:

concurrency:
  group: windows-simulation-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  simulation:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout public simulation package
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: ''
      - name: Create isolated Python environment
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP ("public-sim-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT")
          $venv = Join-Path $work 'venv'
          $evidence = Join-Path $work 'evidence'
          New-Item -ItemType Directory -Path $work | Out-Null
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $venv 'Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) { throw 'Isolated Python executable was not created.' }
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          "PUBLIC_SIM_WORK=$work" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PUBLIC_SIM_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install locked dependencies and verify closure
        shell: pwsh
        run: |
          $python = $env:PUBLIC_SIM_PYTHON
          $evidence = Join-Path $env:PUBLIC_SIM_WORK 'evidence'
          & $python -m pip install --disable-pip-version-check -r requirements-lock.txt *>&1 | Tee-Object (Join-Path $evidence 'dependency-install.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip check *>&1 | Tee-Object (Join-Path $evidence 'pip-check.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run isolated simulation tests
        shell: pwsh
        run: .\run_tests.ps1 -PythonPath $env:PUBLIC_SIM_PYTHON -EvidenceDirectory (Join-Path $env:PUBLIC_SIM_WORK 'evidence')
